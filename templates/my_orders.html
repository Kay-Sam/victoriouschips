<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Orders</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h3>Check Your Order</h3>
  <p>Enter your order reference number below:</p>

  <div class="mb-3">
    <input type="text" id="refInput" class="form-control" placeholder="Order Reference">
  </div>
  <button id="fetchBtn" class="btn btn-primary">Fetch Order</button>

  <hr>
  <div id="orderDetails"></div>
</div>

<script>
document.getElementById("fetchBtn").addEventListener("click", async () => {
  const ref = document.getElementById("refInput").value.trim();
  if (!ref) return alert("Enter a reference number");

  const res = await fetch(`/fetch-order/${ref}`);
  const data = await res.json();
  const container = document.getElementById("orderDetails");

  if (data.error) {
    container.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
  } else {
    container.innerHTML = `
      <h5>Order Details</h5>
      <p><strong>Reference:</strong> ${data.reference}</p>
      <p><strong>Name:</strong> ${data.customer.name}</p>
      <p><strong>Email:</strong> ${data.customer.email}</p>
      <p><strong>Phone:</strong> ${data.customer.phone}</p>
      <p><strong>Address:</strong> ${data.customer.address}</p>
      <p><strong>Total Paid:</strong> ₦${data.total}</p>
      <h6>Items:</h6>
      <ul>
        ${data.cart.map(i => `<li>${i.name} x${i.quantity} - ₦${i.price}</li>`).join("")}
      </ul>
    `;
  }
});
</script>
</body>
</html>
